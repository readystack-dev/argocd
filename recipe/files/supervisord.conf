[supervisord]
nodaemon=true
logfile=/home/argocd/log/supervisord.log
pidfile=/home/argocd/run/supervisord.pid
[unix_http_server]
file=/home/argocd/run/supervisor.sock
[supervisorctl]
serverurl=unix:///home/argocd/run/supervisor.sock
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
; --flannel-backend=none: with --disable-agent there is no node and no pod network. Unless flannel is off, the
; server looks up the host-local CNI plugin at start; the release wrapper's extracted userland used to answer
; that lookup, and the source-built server binary ships without one.
[program:k3s]
command=/usr/local/bin/k3s server --rootless --disable-agent --flannel-backend=none --disable=traefik,servicelb,metrics-server,local-storage --write-kubeconfig-mode 644 --data-dir /home/argocd/.rancher/k3s/data --write-kubeconfig /home/argocd/.kube/config
priority=1
autorestart=true
startretries=40
environment=HOME="/home/argocd",XDG_RUNTIME_DIR="/home/argocd/run"
stdout_logfile=/home/argocd/log/k3s.log
stderr_logfile=/home/argocd/log/k3s.log
[program:redis]
command=/usr/bin/redis-server --port 6379 --save "" --appendonly no
priority=1
autorestart=true
startretries=40
stdout_logfile=/home/argocd/log/redis.log
stderr_logfile=/home/argocd/log/redis.log
[program:bootstrap]
command=/usr/local/bin/bootstrap.sh
priority=5
autorestart=false
startsecs=0
environment=HOME="/home/argocd",KUBECONFIG="/home/argocd/.kube/config"
stdout_logfile=/home/argocd/log/bootstrap.log
stderr_logfile=/home/argocd/log/bootstrap.log
[program:argocd-repo-server]
command=/usr/local/bin/argocd-repo-server --redis localhost:6379
priority=20
autorestart=true
startretries=40
environment=KUBECONFIG="/home/argocd/.kube/config",POD_NAMESPACE="argocd",ARGOCD_NAMESPACE="argocd",HOME="/home/argocd"
stdout_logfile=/home/argocd/log/repo-server.log
stderr_logfile=/home/argocd/log/repo-server.log
[program:argocd-application-controller]
command=/usr/local/bin/argocd-application-controller --redis localhost:6379
priority=25
autorestart=true
startretries=40
environment=KUBECONFIG="/home/argocd/.kube/config",POD_NAMESPACE="argocd",ARGOCD_NAMESPACE="argocd",HOME="/home/argocd"
stdout_logfile=/home/argocd/log/controller.log
stderr_logfile=/home/argocd/log/controller.log
[program:argocd-server]
command=/usr/local/bin/argocd-server --insecure --port 8080 --redis localhost:6379 --repo-server localhost:8081
priority=30
autorestart=true
startretries=40
environment=KUBECONFIG="/home/argocd/.kube/config",POD_NAMESPACE="argocd",ARGOCD_NAMESPACE="argocd",HOME="/home/argocd"
stdout_logfile=/home/argocd/log/argocd-server.log
stderr_logfile=/home/argocd/log/argocd-server.log
